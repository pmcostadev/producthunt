name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      # No env vars needed: this server takes its credential per request, and the
      # OAuth variables are only read at request time.
      - name: Build
        run: npm run build
