name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push cancels the first run rather than queueing behind it. Cancelled
# runs show as cancelled, not failed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      # Build first: it generates next-env.d.ts and the route types that a
      # standalone tsc run needs. Running tsc before this fails on missing
      # generated types rather than on anything real. `next build` also
      # typechecks, so a type error fails here too.
      #
      # No env vars needed: this server takes its credential per request.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
